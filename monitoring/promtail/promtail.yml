server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  # Docker container logs
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # Application logs for each service
  - job_name: api-gateway
    static_configs:
      - targets:
          - localhost
        labels:
          job: api-gateway
          service: api-gateway
          __path__: /var/log/startup-compass/api-gateway/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            service: service
            requestId: requestId
            userId: userId
            method: method
            url: url
            statusCode: statusCode
            responseTime: responseTime
      - labels:
          level:
          service:
      - timestamp:
          format: RFC3339
          source: timestamp

  - job_name: user-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: user-service
          service: user-service
          __path__: /var/log/startup-compass/user-service/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            service: service
            userId: userId
            action: action
      - labels:
          level:
          service:
          action:
      - timestamp:
          format: RFC3339
          source: timestamp

  - job_name: job-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: job-service
          service: job-service
          __path__: /var/log/startup-compass/job-service/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            service: service
            jobId: jobId
            userId: userId
            action: action
      - labels:
          level:
          service:
          action:
      - timestamp:
          format: RFC3339
          source: timestamp

  - job_name: funding-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: funding-service
          service: funding-service
          __path__: /var/log/startup-compass/funding-service/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            service: service
            startupId: startupId
            fundingId: fundingId
            action: action
      - labels:
          level:
          service:
          action:
      - timestamp:
          format: RFC3339
          source: timestamp

  - job_name: notification-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: notification-service
          service: notification-service
          __path__: /var/log/startup-compass/notification-service/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            service: service
            notificationId: notificationId
            userId: userId
            channel: channel
            status: status
      - labels:
          level:
          service:
          channel:
          status:
      - timestamp:
          format: RFC3339
          source: timestamp

  # Nginx access logs (if using nginx)
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/*access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>[\d\.]+) - (?P<remote_user>[^ ]*) \[(?P<time_local>[^\]]*)\] "(?P<method>[^ ]*) (?P<request>[^ ]*) (?P<protocol>[^ ]*)" (?P<status>[\d]+) (?P<body_bytes_sent>[\d]+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'
      - labels:
          method:
          status:
      - timestamp:
          format: 02/Jan/2006:15:04:05 -0700
          source: time_local

  # PostgreSQL logs
  - job_name: postgresql
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgresql
          __path__: /var/log/postgresql/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} \w+) \[(?P<pid>\d+)\] (?P<level>\w+):\s+(?P<message>.*)'
      - labels:
          level:
      - timestamp:
          format: 2006-01-02 15:04:05.000 MST
          source: timestamp

  # Redis logs
  - job_name: redis
    static_configs:
      - targets:
          - localhost
        labels:
          job: redis
          __path__: /var/log/redis/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<pid>\d+):(?P<role>\w) (?P<timestamp>\d{2} \w{3} \d{4} \d{2}:\d{2}:\d{2}\.\d{3}) (?P<level>[*#-]) (?P<message>.*)'
      - labels:
          level:
          role:
      - timestamp:
          format: 02 Jan 2006 15:04:05.000
          source: timestamp

  # Error logs with special handling
  - job_name: errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: errors
          __path__: /var/log/startup-compass/**/error.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            service: service
            error: error
            stack: stack
      - labels:
          level:
          service:
      - timestamp:
          format: RFC3339
          source: timestamp
      - match:
          selector: '{level="error"}'
          stages:
            - template:
                source: output
                template: '🚨 ERROR in {{.service}}: {{.message}} | Stack: {{.stack}}'

  # Audit logs
  - job_name: audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: audit
          __path__: /var/log/startup-compass/**/audit.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            userId: userId
            action: action
            resource: resource
            ip: ip
            userAgent: userAgent
            result: result
      - labels:
          action:
          resource:
          result:
      - timestamp:
          format: RFC3339
          source: timestamp

  # Performance logs
  - job_name: performance
    static_configs:
      - targets:
          - localhost
        labels:
          job: performance
          __path__: /var/log/startup-compass/**/performance.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            service: service
            endpoint: endpoint
            method: method
            responseTime: responseTime
            statusCode: statusCode
            memoryUsage: memoryUsage
            cpuUsage: cpuUsage
      - labels:
          service:
          endpoint:
          method:
      - timestamp:
          format: RFC3339
          source: timestamp