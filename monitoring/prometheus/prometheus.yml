global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Redis metrics
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # PostgreSQL metrics
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # API Gateway service
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # User Service
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Job Service
  - job_name: 'job-service'
    static_configs:
      - targets: ['job-service:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Funding Service
  - job_name: 'funding-service'
    static_configs:
      - targets: ['funding-service:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Notification Service
  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # News Aggregator Service
  - job_name: 'news-aggregator'
    static_configs:
      - targets: ['news-aggregator:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Blackbox exporter for endpoint monitoring
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://api-gateway:3000/health
        - http://user-service:3000/health
        - http://job-service:3000/health
        - http://funding-service:3000/health
        - http://notification-service:3000/health
        - http://news-aggregator:3000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Health check endpoints
  - job_name: 'health-checks'
    static_configs:
      - targets: 
        - 'api-gateway:3000'
        - 'user-service:3000'
        - 'job-service:3000'
        - 'funding-service:3000'
        - 'notification-service:3000'
        - 'news-aggregator:3000'
    metrics_path: '/health'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Custom application metrics
  - job_name: 'app-metrics'
    static_configs:
      - targets:
        - 'api-gateway:3000'
        - 'user-service:3000'
        - 'job-service:3000'
        - 'funding-service:3000'
        - 'notification-service:3000'
        - 'news-aggregator:3000'
    metrics_path: '/api/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s