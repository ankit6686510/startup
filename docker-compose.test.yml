version: '3.8'

services:
  api-gateway-test:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=test
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=startup_compass_test
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - JWT_SECRET=test-jwt-secret
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-service-test:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=test
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=startup_compass_test
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - JWT_SECRET=test-jwt-secret
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  job-service-test:
    build:
      context: ./services/job-service
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=test
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=startup_compass_test
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - JWT_SECRET=test-jwt-secret
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  funding-service-test:
    build:
      context: ./services/funding-service
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=test
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=startup_compass_test
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - JWT_SECRET=test-jwt-secret
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-service-test:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=test
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=startup_compass_test
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - JWT_SECRET=test-jwt-secret
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_DB: startup_compass_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d startup_compass_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-test:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Test runner service
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
      - API_GATEWAY_URL=http://api-gateway-test:3000
      - USER_SERVICE_URL=http://user-service-test:3000
      - JOB_SERVICE_URL=http://job-service-test:3000
      - FUNDING_SERVICE_URL=http://funding-service-test:3000
      - NOTIFICATION_SERVICE_URL=http://notification-service-test:3000
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=startup_compass_test
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
    depends_on:
      api-gateway-test:
        condition: service_healthy
      user-service-test:
        condition: service_healthy
      job-service-test:
        condition: service_healthy
      funding-service-test:
        condition: service_healthy
      notification-service-test:
        condition: service_healthy
    command: npm run test:e2e

volumes:
  postgres_test_data:
  redis_test_data:

networks:
  default:
    name: startup-compass-test